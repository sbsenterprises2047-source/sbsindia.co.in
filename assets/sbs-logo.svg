<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">SBS Enterprises — Solar Ka Badshah</title>
<desc id="desc">Bold blue SBS lettering with a golden sunrise, solar panel motif, and the slogan Solar Ka Badshah.</desc>
<defs>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1599ed"/><stop offset=".48" stop-color="#0756b5"/><stop offset="1" stop-color="#06245f"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdf37"/><stop offset=".55" stop-color="#ffad08"/><stop offset="1" stop-color="#f07800"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36c4ff"/><stop offset="1" stop-color="#073e9d"/></linearGradient>
</defs>
<!-- sunrise -->
<g fill="url(#gold)" stroke="#fff" stroke-width="2">
 <path d="M309 92 L292 29 L325 78 Z"/><path d="M347 79 L350 8 L370 78 Z"/><path d="M391 80 L423 24 L412 92 Z"/><path d="M424 93 L475 52 L448 111 Z"/><path d="M280 111 L237 74 L268 130 Z"/>
 <path d="M272 128 A91 91 0 0 1 448 128 Z" stroke="none"/>
</g>
<!-- bold brand letters -->
<text x="360" y="211" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="900" font-style="italic" letter-spacing="-12" fill="url(#blue)" stroke="#fff" stroke-width="2" paint-order="stroke">SBS</text>
<!-- orbit swoosh -->
<path d="M86 169 C145 103 199 112 257 129 C196 123 145 159 164 180 C195 213 279 209 344 183 C260 235 143 241 91 207 C69 193 68 180 86 169Z" fill="url(#gold)"/>
<!-- solar panel on S -->
<g transform="translate(458 165) skewX(-23)" stroke="#e8f7ff" stroke-width="3">
 <rect x="0" y="0" width="142" height="54" rx="2" fill="url(#panel)"/>
 <path d="M35 0V54 M70 0V54 M105 0V54 M0 27H142" fill="none"/>
</g>
<text x="360" y="274" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="900" font-style="italic" letter-spacing="3" fill="url(#blue)">ENTERPRISES</text>
<path d="M92 305H205 M515 305H628" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
<text x="360" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900" font-style="italic" letter-spacing="2" fill="url(#gold)">SOLAR KA BADSHAH</text>
</svg>